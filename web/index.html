<!doctype html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />

    <title>__APP_TITLE__</title>

    <meta
      id="app-description"
      name="description"
      content="__APP_DESCRIPTION__"
    />

    <meta id="app-theme-color" name="theme-color" content="__THEME_COLOR__" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__APP_TITLE__" />
    <meta property="og:title" content="__APP_TITLE__" />
    <meta property="og:description" content="__APP_DESCRIPTION__" />
    <meta property="og:url" content="__APP_URL__" />
    <meta property="og:image" content="__APP_IMAGE__" />
    <meta property="og:image:secure_url" content="__APP_IMAGE__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- X/Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__APP_TITLE__" />
    <meta name="twitter:description" content="__APP_DESCRIPTION__" />
    <meta name="twitter:image" content="__APP_IMAGE__" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      id="apple-mobile-web-app-title"
      name="apple-mobile-web-app-title"
      content="__APP_TITLE__"
    />

    <link id="apple-touch-icon" rel="apple-touch-icon" href="favicon.png" />

    <link id="app-favicon" rel="icon" type="image/png" href="favicon.png" />

    <link id="app-manifest" rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <!--
      Legacy Flutter service-worker cleanup.

      Older Flutter releases registered a root-scoped
      flutter_service_worker.js that could cache an outdated
      application's JavaScript and configuration.

      New builds use PWA_STRATEGY=none.

      This cleanup:
        - Targets only the legacy Flutter worker.
        - Preserves Firebase Messaging.
        - Avoids repeated reloads.
        - Completes before starting Flutter.
    -->
    <script>
      window.__afyakitLegacyWorkerCleanup = (async () => {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        const CLEANUP_KEY = "afyakit-legacy-flutter-sw-cleanup-v1";

        try {
          const registrations =
            await navigator.serviceWorker.getRegistrations();

          let removed = false;

          for (const registration of registrations) {
            const workers = [
              registration.active,
              registration.waiting,
              registration.installing,
            ].filter(Boolean);

            const isLegacyFlutterWorker = workers.some((worker) => {
              try {
                const url = new URL(worker.scriptURL);

                return (
                  url.origin === window.location.origin &&
                  url.pathname === "/flutter_service_worker.js" &&
                  new URL(registration.scope).pathname === "/"
                );
              } catch (_) {
                return false;
              }
            });

            if (!isLegacyFlutterWorker) {
              continue;
            }

            const success = await registration.unregister();

            if (success) {
              removed = true;

              console.info(
                "🧹 Removed legacy Flutter service worker:",
                registration.scope,
              );
            }
          }

          if (removed && !sessionStorage.getItem(CLEANUP_KEY)) {
            sessionStorage.setItem(CLEANUP_KEY, "1");

            console.info("🔄 Reloading with the current Flutter application.");

            window.location.reload();

            // Prevent this page from starting Flutter
            // while the reload is pending.
            return new Promise(() => {});
          }
        } catch (error) {
          console.warn(
            "⚠️ Legacy Flutter service worker cleanup failed:",
            error,
          );
        }
      })();
    </script>

    <!-- Runtime branding from the app manifest -->
    <script>
      (() => {
        const MANIFEST_URL = "manifest.webmanifest";

        const setMetaContent = (id, value) => {
          const element = document.getElementById(id);

          if (element && value) {
            element.setAttribute("content", value);
          }
        };

        const setHref = (id, value) => {
          const element = document.getElementById(id);

          if (element && value) {
            element.setAttribute("href", value);
          }
        };

        const resolveManifestAsset = (src) => {
          if (!src) return "favicon.png";

          try {
            return new URL(src, new URL(MANIFEST_URL, window.location.href))
              .href;
          } catch (_) {
            return src;
          }
        };

        const hasPurpose = (icon, purpose) => {
          const purposes = String(icon.purpose || "any")
            .split(/\s+/)
            .filter(Boolean);

          return purposes.includes(purpose);
        };

        const pickIcon = (manifest) => {
          const icons = Array.isArray(manifest.icons) ? manifest.icons : [];

          const preferred =
            icons.find(
              (icon) => icon.sizes === "192x192" && hasPurpose(icon, "any"),
            ) ||
            icons.find(
              (icon) => icon.sizes === "512x512" && hasPurpose(icon, "any"),
            ) ||
            icons.find((icon) => icon.sizes === "192x192" && !icon.purpose) ||
            icons.find((icon) => icon.sizes === "512x512" && !icon.purpose) ||
            icons.find((icon) => icon.src);

          return resolveManifestAsset(preferred?.src);
        };

        const applyBranding = (manifest) => {
          if (!manifest) return;

          const title = manifest.name || manifest.short_name || "";

          const description = manifest.description || title;

          const icon = pickIcon(manifest);

          if (title) {
            document.title = title;

            setMetaContent("apple-mobile-web-app-title", title);
          }

          setMetaContent("app-description", description);

          setMetaContent("app-theme-color", manifest.theme_color);

          setHref("apple-touch-icon", icon);
          setHref("app-favicon", icon);
        };

        const loadBranding = async () => {
          try {
            const response = await fetch(MANIFEST_URL, {
              cache: "no-store",
              credentials: "same-origin",
            });

            if (!response.ok) return;

            const manifest = await response.json();

            applyBranding(manifest);
          } catch (_) {
            // Build-time metadata remains as fallback.
          }
        };

        window.addEventListener(
          "load",
          () => {
            window.setTimeout(loadBranding, 0);
          },
          { once: true },
        );
      })();
    </script>

    <!-- Firebase Cloud Messaging -->
    <script>
      (() => {
        if (!("serviceWorker" in navigator)) {
          console.warn("🔕 Service workers are not supported by this browser.");
          return;
        }

        window.addEventListener(
          "load",
          async () => {
            try {
              const registration = await navigator.serviceWorker.register(
                "/firebase-messaging-sw.js",
                {
                  scope: "/firebase-cloud-messaging-push-scope",
                },
              );

              console.log(
                "🔔 Firebase Messaging service worker registered:",
                registration.scope,
              );
            } catch (error) {
              console.error(
                "❌ Firebase Messaging service worker registration failed:",
                error,
              );
            }
          },
          { once: true },
        );
      })();
    </script>

    <!--
      Start Flutter only after the legacy-worker cleanup
      has completed. Do not allow an outdated worker to
      continue controlling the bootstrap sequence.
    -->
    <script>
      (async () => {
        try {
          await window.__afyakitLegacyWorkerCleanup;
        } catch (error) {
          console.warn(
            "⚠️ Continuing Flutter startup after cleanup error:",
            error,
          );
        }

        const script = document.createElement("script");
        script.src = "flutter_bootstrap.js";
        script.async = false;

        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
